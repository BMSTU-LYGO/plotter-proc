name: CI

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  fast:
    name: Fast regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          make install
      - name: Lint
        run: make lint
      - name: Unit tests
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_pipeline_stages.py
          tests/test_stage_cache.py
          tests/test_config_profiles.py
          tests/test_centerline_config.py
          tests/test_handwriting.py
          tests/test_connection_safety.py
      - name: Key integration, cache and G-code safety tests
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_document_reader.py
          tests/test_docx_document_reader.py
          tests/test_pdf_document_reader.py
          tests/test_pipeline_stage_cache.py
          tests/test_centerline_serializer.py
          tests/test_multipage_gcode_exporter.py
          tests/test_speed_benchmark.py
      - name: Centerline DOCX smoke
        run: make smoke

  heavy:
    name: Full audit and representative benchmark
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          make install
      - name: Full audit
        run: make audit
