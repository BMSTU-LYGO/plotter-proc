version: 1
page: A5
fonts:
  primary: ../assets/1.ttf
  fallbacks:
    - role: math
      path: /usr/share/fonts/truetype/noto/NotoSansMath-Regular.ttf
elements:
  - id: title
    type: text
    text: "Формула площади круга"
    x_mm: 10
    y_mm: 12
    width_mm: 128
    size: normal
    font_mode: centerline
    z_order: 1
  - id: formula
    type: text
    text: "S = πr²"
    x_mm: 20
    y_mm: 35
    width_mm: 100
    size: large
    font_mode: centerline
    z_order: 2
  - id: diagram
    type: svg
    path: assets/circle-diagram.svg
    x_mm: 30
    y_mm: 60
    width_mm: 80
    height_mm: 70
    fit: contain
    z_order: 3
