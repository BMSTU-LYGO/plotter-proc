page_origin_mm:
  x: 10.0
  y: 10.0

page_position_profiles:
  A5:
    origin_x_mm: 10.0
    origin_y_mm: 10.0
  A4:
    origin_x_mm: 5.0
    origin_y_mm: 55.0
    down_z_mm: 0.1
    pause_seconds: 90

axes:
  invert_x: false
  invert_y: true

pen:
  up_z_mm: 2.5
  down_z_mm: 1.0
  settle_ms: 20

feedrate_mm_min:
  draw: 6000
  travel: 6000
  z: 1200

motion:
  max_xy_feedrate_mm_s: 120
  draw_acceleration_mm_s2: 1500
  travel_acceleration_mm_s2: 2000
  junction_mode: none # use classic_jerk only after confirming firmware configuration
  xy_jerk_mm_s: 15
  junction_deviation_mm: 0.02

workspace_mm:
  min_x: 0.0
  max_x: 225.0
  min_y: 0.0
  max_y: 355.0

gcode:
  home: false
  absolute_positioning: true
  units_mm: true
  decimals: 3

page_change:
  enabled: true
  pause_seconds: 30
  park:
    mode: corner
    corner: top_right
    inset_mm: 5.0
  wait_command: dwell
  keep_steppers_enabled: true
