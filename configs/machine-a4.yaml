# Поля листа А4 по 10 мм заданы в configs/layout.yaml.
page_origin_mm:
  x: 5.0
  y: 55.0

axes:
  invert_x: false
  invert_y: true

pen:
  up_z_mm: 5.0
  down_z_mm: 1.0
  settle_ms: 100

feedrate_mm_min:
  draw: 1000
  travel: 3000
  z: 500

workspace_mm:
  min_x: 0.0
  max_x: 225.0
  min_y: 55.0
  max_y: 355.0

gcode:
  home: false
  absolute_positioning: true
  units_mm: true
  decimals: 3

page_change:
  enabled: true
  pause_seconds: 90
  park:
    mode: corner
    corner: top_right
    inset_mm: 5.0
  wait_command: dwell
  keep_steppers_enabled: true
