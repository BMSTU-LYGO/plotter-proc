pages:
  A4:
    width_mm: 210.0
    height_mm: 297.0
  A5:
    width_mm: 148.0
    height_mm: 210.0

margins_mm:
  left: 10.0
  right: 10.0
  top: 10.0
  bottom: 10.0

sizes:
  small:
    em_size_mm: 4.0
    line_height_multiplier: 1.25
    paragraph_spacing_mm: 2.0
  normal:
    em_size_mm: 5.0
    line_height_multiplier: 1.25
    paragraph_spacing_mm: 2.5
  large:
    em_size_mm: 6.5
    line_height_multiplier: 1.30
    paragraph_spacing_mm: 3.0

vector:
  flatten_tolerance_mm: 0.08
  min_segment_length_mm: 0.03
  max_points_per_contour: 5000
  max_recursion_depth: 20
  optimize_travel: true

preview:
  plotter_stroke_width_mm: 0.20
  show_page_border: true

layout:
  missing_glyph_policy: error
  tab_spaces: 4

centerline:
  algorithm_version: 6
  render:
    em_resolution_px: 2048
    padding_px: 128
    threshold: 160
    closing_radius_px: 1
  skeleton:
    method: auto
    candidate_methods: [skeletonize, medial_axis]
    use_crossing_number: true
    suppress_corner_diagonals: true
    min_branch_width_factor: 1.5
    max_junction_cluster_px: 64
    max_micro_loop_width_factor: 2.0
  routing:
    strategy: one_stroke_per_component
    allow_retrace: true
    minimize_retrace_length: true
    max_retrace_ratio: 0.45
    exact_matching_max_odd_vertices: 20
    fallback_strategy: minimum_strokes
    deterministic: true
  strokes:
    tangent_sample_px: 10
    junction_max_angle_deg: 35.0
    resample_step_px: 2.0
    simplify_tolerance_px: 1.0
    spline_smoothing_factor: 0.04
    output_step_px: 3.0
    max_points_per_stroke: 3000
  quality:
    min_mask_coverage: 0.70
    max_reconstruction_extra: 0.25
    max_endpoint_factor: 8.0
    fail_on_low_quality: false
  cache:
    enabled: true
    directory: build/font-cache
  debug:
    enabled: false
  glyph_overrides: {}
