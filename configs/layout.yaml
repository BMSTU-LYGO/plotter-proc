pages:
  A4:
    width_mm: 210.0
    height_mm: 297.0
    hole_clearance_mm: 1.0
    holes: []
  A5:
    width_mm: 148.0
    height_mm: 210.0
    hole_clearance_mm: 1.0
    holes:
      - {x_mm: 6.0, y_mm: 80.0, radius_mm: 3.0}
      - {x_mm: 6.0, y_mm: 130.0, radius_mm: 3.0}

margins_mm:
  left: 10.0
  right: 10.0
  top: 10.0
  bottom: 10.0

grid:
  enabled: false
  cell_width_mm: 5.0
  cell_height_mm: 5.0
  origin_x_mm: 0.0
  origin_y_mm: 0.0
  baseline_offset_mm: 0.0

sizes:
  small:
    em_size_mm: 4.0
    line_height_multiplier: 1.25
    paragraph_spacing_mm: 2.0
    max_word_space_factor: 1.5
    punctuation_gap_mm: 0.25
    punctuation_vertical_offset_mm: 0.0
  normal:
    em_size_mm: 5.0
    line_height_multiplier: 1.25
    paragraph_spacing_mm: 2.5
    max_word_space_factor: 1.5
    punctuation_gap_mm: 0.25
    punctuation_vertical_offset_mm: 0.0
  large:
    em_size_mm: 6.5
    line_height_multiplier: 1.30
    paragraph_spacing_mm: 3.0
    max_word_space_factor: 1.5
    punctuation_gap_mm: 0.25
    punctuation_vertical_offset_mm: 0.0

vector:
  flatten_tolerance_mm: 0.08
  min_segment_length_mm: 0.03
  max_points_per_contour: 5000
  max_recursion_depth: 20
  optimize_travel: true

preview:
  plotter_stroke_width_mm: 0.20
  show_page_border: true

document_layout:
  mode: auto
  preserve:
    fit: contain
    max_upscale: 1.10
    clip_to_page: false
  hybrid:
    image_padding_mm: 2.0
    max_vertical_shift_mm: 25.0
    max_horizontal_shift_mm: 20.0
    allow_side_switch: false
    fallback: top_bottom
    max_placement_attempts: 20

text_decorations:
  underline:
    offset_em: 0.12
    double_gap_mm: 0.45
    min_length_mm: 0.5
    join_adjacent_runs_gap_mm: 0.3

shapes:
  arrows:
    endpoint_tolerance_mm: 1.2
    angle_tolerance_deg: 25
    min_shaft_length_mm: 2.0
    head_min_size_mm: 0.8
    head_max_size_mm: 8.0
    filled_head_mode: open_v

tables:
  draw_order: borders_first
  max_cells: 10000
  cell_padding_mm: 1.2
  pdf_detection:
    enabled: true
    snap_tolerance_mm: 0.6
    min_rows: 2
    min_columns: 2

pagination:
  enabled: true
  preserve_source_page_breaks: true
  footer:
    enabled: true
    reserved_height_mm: 8.0
    baseline_from_bottom_mm: 4.5
    format: "{page}"
    size: small
    font_mode: centerline

latex:
  enabled: true
  backend: mathtext
  stroke_mode: centerline
  max_expression_length: 4000
  max_elements_per_document: 500
  inline_size_scale: 1.0
  block_size_scale: 1.15
  block_spacing_before_mm: 2.0
  block_spacing_after_mm: 2.0
  block_alignment: center
  min_scale: 0.65
  curve_tolerance_mm: 0.04
  render_ppmm: 24
  supersample: 2
  threshold: 160
  closing_radius_px: 1
  min_component_length_mm: 0.20
  max_render_pixels: 16000000
  max_components: 5000
  max_points: 150000
  fallback_to_outline: false
  strict_quality: false
  pdf_math:
    mode: auto
    render_ppmm: 24
    bbox_padding_mm: 0.8
    confidence_threshold: 0.75
    max_region_area_ratio: 0.35

images:
  enabled: true
  mode: auto
  max_input_pixels: 12000000
  max_working_side_px: 1600
  background: white
  autocontrast: true
  blur_sigma: 0.6
  threshold:
    method: otsu
    value: 160
  remove_small_objects_px: 12
  edge:
    sigma: 1.2
    low_threshold: 0.08
    high_threshold: 0.20
  hatching:
    spacing_mm: 1.2
    levels: 4
    min_feature_size_mm: 0.4
  vector:
    simplify_tolerance_mm: 0.08
    min_stroke_length_mm: 0.35
    max_points_per_image: 100000
    max_strokes_per_image: 10000
  spacing_before_mm: 2.0
  spacing_after_mm: 2.0
  default_width_ratio: 0.75
  max_height_ratio: 0.60
  min_wrap_padding_mm: 0.7
  max_wrap_padding_mm: 8.0

layout:
  missing_glyph_policy: error
  tab_spaces: 4
  engine: legacy
  language: ru
  script: Cyrl
  direction: ltr
  features: []

paragraphs:
  default_tab_interval_mm: 12.5
  preserve_relative_font_size: true
  source_body_font_size_pt: 12.0
  min_font_scale: 0.80
  max_font_scale: 1.60
  max_extra_space_per_word_mm: 4.0
  max_word_space_factor: 1.5
  punctuation_gap_mm: 0.25
  punctuation_vertical_offset_mm: 0.0
  max_space_before_mm: 12.0
  max_space_after_mm: 12.0
  semantic_scale:
    title: 1.35
    heading_1: 1.25
    heading_2: 1.15
    heading_3: 1.08
    body: 1.00

tables:
  min_column_width_mm: 8.0
  cell_padding_mm: 1.2
  min_cell_padding_mm: 0.7
  max_cell_padding_mm: 2.0
  scale_padding_with_page: true
  min_text_scale: 0.75

centerline:
  algorithm_version: 7
  render:
    em_resolution_px: 2048
    padding_px: 128
    threshold: 160
    closing_radius_px: 1
  skeleton:
    method: auto
    candidate_methods: [skeletonize, medial_axis]
    use_crossing_number: true
    suppress_corner_diagonals: true
    min_branch_width_factor: 1.5
    max_junction_cluster_px: 64
    max_micro_loop_width_factor: 2.0
    spur_pruning:
      enabled: true
      max_coverage_loss: 0.01
      preserve_connector_terminals: true
      preserve_counter_edges: true
  routing:
    strategy: one_stroke_per_component
    allow_retrace: true
    minimize_retrace_length: true
    max_retrace_ratio: 0.45
    exact_matching_max_odd_vertices: 20
    fallback_strategy: minimum_strokes
    deterministic: true
  strokes:
    tangent_sample_px: 10
    junction_max_angle_deg: 35.0
    resample_step_px: 2.0
    simplify_tolerance_px: 1.0
    spline_smoothing_factor: 0.04
    output_step_px: 3.0
    max_points_per_stroke: 3000
  quality:
    min_mask_coverage: 0.70
    max_reconstruction_extra: 0.25
    max_endpoint_factor: 8.0
    fail_on_low_quality: false
  cache:
    enabled: true
    directory: 1-font-cache
  debug:
    enabled: false
  glyph_overrides: {}
  font_overrides:
    4dac9db3fa9ca072f7861fd916bf04bdceac6069d0f3a886f5e523d922e918f1:
      glyphs:
        "ъ":
          threshold: 160
          closing_radius_px: 0
          skeleton_method: medial_axis
          min_branch_width_factor: 1.0
          simplify_tolerance_px: 0.7
          spline_smoothing_factor: 0.02
        "ь":
          threshold: 160
          closing_radius_px: 0
          skeleton_method: medial_axis
          min_branch_width_factor: 1.0
          simplify_tolerance_px: 0.7
          spline_smoothing_factor: 0.02
        "ы":
          threshold: 160
          closing_radius_px: 0
          skeleton_method: medial_axis
          min_branch_width_factor: 1.0
          simplify_tolerance_px: 0.7
          spline_smoothing_factor: 0.02
  glyph_patch_file:

handwriting:
  variation:
    enabled: false
    seed: 1
    baseline_jitter_mm: 0.15
    rotation_deg: 1.0
    scale_percent: 2.0
    spacing_jitter_mm: 0.15
  spacing:
    max_kerning_adjustment_mm: 0.15
    shape_aware: true
  stroke_order:
    enabled: true
    glyphs: ["ъ", "ь", "ы", "ж", "ф", "т"]
  routing:
    next_glyph_lookahead: true
    max_current_travel_penalty_mm: 0.35
    cost:
      travel: 1.0
      pen_lift: 8.0
      retrace: 1.5
      direction_change: 0.011111111111111112
      connection_quality: 2.0
      collision_risk: 100.0
    cost_profiles:
      superfast:
        travel: 1.0
        pen_lift: 24.0
        retrace: 0.65
        direction_change: 0.005555555555555556
        connection_quality: 1.5
        collision_risk: 100.0
  retrace:
    enabled: true
    max_length_mm: 1.2
    max_repeats: 1
    allowed_segment_types: [glyph]
    endpoint_tolerance_mm: 0.000001
    max_retrace_ratio: 1.0
    profiles:
      superfast:
        max_length_mm: 3.0
        max_repeats: 3
        allowed_segment_types: [glyph, connector, snap, retrace]
        endpoint_tolerance_mm: 0.08
        max_retrace_ratio: 0.65

connections:
  enabled: false
  mode: safe
  max_distance_mm: 2.5
  max_vertical_offset_mm: 2.0
  max_tangent_mismatch_deg: 135.0
  connector_step_mm: 0.20
  min_corridor_inside_ratio: 0.75
  allow_connector_outside_ink: true
  outside_ink_margin_mm: 0.35
  contact_epsilon_mm: 0.08
  collision_clearance_mm: 0.10
  pair_rules:
    ст: {spacing_adjustment_mm: -0.08, handle_scale: 1.05}
    ов: {spacing_adjustment_mm: -0.06, handle_scale: 1.05}
    пр: {spacing_adjustment_mm: -0.08, handle_scale: 1.08}
    ть: {spacing_adjustment_mm: 0.04, handle_scale: 0.95}
    ло: {spacing_adjustment_mm: -0.06, handle_scale: 1.05}
    ро: {spacing_adjustment_mm: -0.06, handle_scale: 1.05}
    на: {spacing_adjustment_mm: -0.05, handle_scale: 1.03}
    по: {spacing_adjustment_mm: -0.06, handle_scale: 1.05}
  connect_letters_only: true
  connect_across_punctuation: false
  do_not_join_before: [".", ",", "!", "?", ":", ";", ")"]
  do_not_join_after: ["(", "«", "-"]
  lift_between_words: true
